version: "2"
run:
  timeout: 5m
  concurrency: 4
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - unused
    - errcheck
    - errorlint
    - nilerr
    - forcetypeassert
    - copyloopvar
    - durationcheck
    - gocritic
    - revive
    - godot
    - predeclared
    - asciicheck
    - ineffassign
    - unconvert
    - gosec
    - bidichk
    - bodyclose
    - noctx
    - containedctx
    - fatcontext
    - nolintlint
  settings:
    errcheck:
      check-type-assertions: true
    nolintlint:
      require-explanation: true
      require-specific: true
issues:
  max-issues-per-linter: 0
  max-same-issues: 50
formatters:
  enable:
    - gofmt
